<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Samspill i naturen</title>
<style>
:root{--g:#173f31;--g2:#2e6b53;--p:#f2f7f3;--l:#d8e4dc;--t:#26322c;--muted:#68776f;--ok:#e8f5eb;--bad:#fbece8}*{box-sizing:border-box}body{margin:0;background:#f4f5f2;color:var(--t);font-family:Arial,sans-serif}.wrap{max-width:1120px;min-height:100vh;margin:auto;background:#fff;padding:30px 30px 50px;box-shadow:0 10px 50px #173f3110}h1,h2{font-family:Georgia,serif;color:var(--g)}h1{font-size:40px;margin:0}button,select,input{font:inherit}.hidden{display:none!important}
.menu{max-width:820px;margin:55px auto}.lead{color:var(--muted);font-size:18px;line-height:1.5;margin:10px 0 34px}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.mode{border:2px solid var(--l);border-radius:18px;padding:24px;background:#fff;text-align:left;cursor:pointer;transition:.15s}.mode:hover,.mode.sel{border-color:var(--g2);background:var(--p)}.mode b{display:block;font:26px Georgia,serif;color:var(--g);margin-bottom:8px}.mode span{line-height:1.45;color:#56665e}.countbox{margin-top:28px;padding:22px;border-radius:16px;background:var(--p);display:flex;align-items:center;justify-content:space-between;gap:20px}.counter{display:flex;align-items:center;gap:12px}.counter button{width:42px;height:42px;border:1px solid var(--l);border-radius:50%;background:#fff;font-size:24px;cursor:pointer}.counter strong{font-size:24px;min-width:42px;text-align:center}.start{display:block;width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;background:var(--g);color:white;font-weight:700;font-size:17px;cursor:pointer}.start:disabled{opacity:.4;cursor:not-allowed}
header{display:flex;align-items:end;gap:25px;border-bottom:1px solid var(--l);padding-bottom:16px}.headtitle{white-space:nowrap}.sub{color:var(--muted);margin-top:4px}.progress{flex:1}.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:7px}.track{height:7px;background:#edf1ee;border-radius:10px;overflow:hidden}.track i{display:block;height:100%;background:var(--g2)}
.pair{display:grid;grid-template-columns:1fr 190px 1fr;gap:28px;align-items:center;padding:30px 0 20px}.species{text-align:center}.pic{height:245px;display:flex;align-items:center;justify-content:center}.pic img{max-width:100%;max-height:235px;object-fit:contain}.species-title{display:flex;align-items:center;justify-content:center;gap:8px;font:700 23px Georgia,serif;color:var(--g)}.info{width:27px;height:27px;border-radius:50%;border:1px solid #9eb7aa;background:#fff;color:var(--g);font:700 17px Georgia,serif;cursor:pointer}.middle{text-align:center}.signrow{display:flex;align-items:center;justify-content:center;gap:12px}.signbadge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--p);border:1px solid var(--l);font-size:27px;font-weight:700;color:var(--g)}.arrow{font-size:28px;color:#91a39a}.signselect{width:64px;height:48px;border:1px solid #b9c9c0;border-radius:10px;background:#fff;font-weight:700;font-size:20px;text-align:center}.hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}
.card{max-width:780px;margin:8px auto;border:1px solid var(--l);border-radius:17px;padding:24px;background:#fff}.card h2{margin:0 0 17px;font-size:25px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:1px solid var(--l);border-radius:11px;padding:12px;text-align:center;cursor:pointer;font-weight:700;background:#fff}.choice.sel{border-color:var(--g);background:var(--p);color:var(--g)}.subs{display:none;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px;padding:12px;background:#f7f9f7;border-radius:12px}.subs.show{display:grid}.subchoice{border:1px solid var(--l);border-radius:10px;padding:10px;text-align:center;cursor:pointer}.subchoice.sel{border-color:var(--g);background:#fff;color:var(--g);font-weight:700}.feedback{display:none;margin-top:16px;padding:14px 16px;border-radius:11px;line-height:1.45}.feedback.show{display:block}.feedback.ok{background:var(--ok)}.feedback.no{background:var(--bad)}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 18px;background:var(--g);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#edf2ef;color:var(--g)}
.modal{position:fixed;inset:0;background:#13251e70;display:none;align-items:center;justify-content:center;padding:22px;z-index:20}.modal.show{display:flex}.modalbox{width:min(520px,100%);background:#fff;border-radius:18px;padding:26px;box-shadow:0 20px 70px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:20px}.modalbox h2{margin:0}.close{border:0;background:#eef3ef;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:20px}.modalbox p{font-size:16px;line-height:1.6;margin:18px 0 0}.result{text-align:center;max-width:680px;margin:70px auto}.bigscore{font:60px Georgia,serif;color:var(--g);margin:20px}.result p{color:var(--muted);font-size:17px}.result .btn{margin:8px}
@media(max-width:760px){.wrap{padding:20px 16px}.modegrid{grid-template-columns:1fr}.countbox{align-items:flex-start;flex-direction:column}.pair{grid-template-columns:1fr 80px 1fr;gap:8px}.pic{height:170px}.pic img{max-height:165px}.species-title{font-size:18px}.middle .hint{display:none}.choices,.subs{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.progress{width:100%}}
</style></head><body><div class="wrap">
<section id="menu" class="menu"><h1>Samspill i naturen</h1><p class="lead">Velg nivå og hvor mange tilfeldige samspill du vil arbeide med.</p><div class="modegrid"><button class="mode" data-mode="simple"><b>Enkel</b><span>Se hvordan artene påvirkes, og velg hvilken type samspill det er.</span></button><button class="mode" data-mode="advanced"><b>Avansert</b><span>Bestem selv om hver art får fordel (+), ulempe (−) eller er omtrent upåvirket (0), og velg deretter samspillet.</span></button></div><div class="countbox"><div><b>Hvor mange samspill?</b><div class="sub">Trekkes tilfeldig uten gjentakelser.</div></div><div class="counter"><button id="minus">−</button><strong id="count">10</strong><button id="plus">+</button></div></div><button id="start" class="start" disabled>Velg nivå for å starte</button></section>

<section id="result" class="result hidden"></section>

mråder kan rødrev spise blant annet smågnagere, fugler og åtsler, og den kan bruke de samme hiområdene og matressursene som andre rever.","fb":"En liten rev som er tilpasset kalde fjell- og arktiske områder. Den lever blant annet av smågnagere, fugler og åtsler og er avhengig av tilgang på mat og gode hiområder."},{"a":"Gran","b":"Bjørk","ka":"old_spruce","kb":"old_birch","sa":"−","sb":"−","rel":"Konkurranse","fa":"Et eviggrønt bartre som trenger lys, vann, mineralnæring og plass til røtter og krone. Når trær står tett, blir tilgangen på disse ressursene mer begrenset.","fb":"Et løvtre som trenger lys, vann, mineralnæring og plass for å vokse. Bjørk kan vokse i mange av de samme områdene som gran."},{"a":"Løve","b":"Flekkhyene","ka":"old_lion","kb":"old_hyena","sa":"−","sb":"−","rel":"Konkurranse","fa":"Et stort afrikansk rovdyr som jakter på planteetende dyr og også kan spise åtsler. I samme område kan flere rovdyr være interessert i de samme byttedyrene og kadavrene.","fb":"Et stort afrikansk rovpattedyr som både jakter selv og spiser åtsler. Den kan bruke mange av de samme matkildene og leveområdene som andre store rovdyr."},{"a":"Ulv","b":"Prærieulv","ka":"old_wolf","kb":"old_coyote","sa":"−","sb":"−","rel":"Konkurranse","fa":"Et stort rovpattedyr i hundefamilien. Ulv jakter blant annet på hjortedyr og mindre pattedyr og bruker store leveområder der andre rovdyr også kan lete etter mat.","fb":"Et nordamerikansk rovpattedyr som spiser blant annet små og mellomstore dyr og åtsler. Leveområde og matvalg kan overlappe med større rovdyr."},{"a":"Gaupe","b":"Rådyr","ka":"old_lynx","kb":"old_deer","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"Et mellomstort kattedyr som jakter ved å snike seg innpå dyr på bakken. Rådyr er blant dyrene en gaupe kan fange og spise.","fb":"Et lite hjortedyr som lever av planter. Det beveger seg i skog og kulturlandskap og kan bli fanget av større rovdyr."},{"a":"Ulv","b":"Elg","ka":"old_wolf","kb":"old_moose","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"Et stort rovpattedyr som jakter i familiegrupper. I områder med elg kan elg være en viktig matkilde for ulven.","fb":"Det største hjortedyret. Elgen lever av planter, og særlig unge eller svekkede individer kan bli tatt av store rovdyr."},{"a":"Isbjørn","b":"Ringsel","ka":"old_polarbear","kb":"old_ringseal","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"Et stort rovdyr i Arktis som tilbringer mye tid på havisen. Det jakter særlig ved steder der sel kommer opp for å puste eller hvile.","fb":"En liten arktisk sel som lever mye av livet i og under havisen. Den må opp til overflaten for å puste og bruker hull i isen og snøhuler."},{"a":"Gepard","b":"Gaselle","ka":"old_cheetah","kb":"old_gazelle","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"Et raskt rovdyr på åpne afrikanske områder. Det jakter på mindre og mellomstore planteetere ved å komme svært raskt opp i fart.","fb":"Et lett og hurtig planteetende hovdyr som lever i åpne landskap. Høy fart og raske retningsendringer kan hjelpe den å unnslippe rovdyr."},{"a":"Humle","b":"Blomsterplante","ka":"old_bumblebee","kb":"old_flower","sa":"+","sb":"+","rel":"Mutualisme","fa":"Et hårete insekt som besøker blomster for å samle nektar og pollen som mat. Når humla beveger seg mellom blomster, kan pollenkorn feste seg til kroppen og bli med videre.","fb":"En plante som danner blomster. Mange blomster produserer nektar og pollen, og for å danne frø må pollen overføres til blomstens hunnlige deler."},{"a":"Mykorrhizasopp","b":"Gran","ka":"old_mycorrhiza","kb":"old_spruce","sa":"+","sb":"+","rel":"Mutualisme","fa":"En sopp som lever tett knyttet til planterøtter. Sopptrådene øker kontaktflaten mot jorda og kan ta opp vann og mineralstoffer, mens soppen selv trenger energirike karbonforbindelser.","fb":"Et eviggrønt bartre. Røttene tar opp vann og mineralstoffer fra jorda, mens sukker og andre energirike stoffer dannes ved fotosyntese i nålene."},{"a":"Maur","b":"Bladlus","ka":"old_ant","kb":"old_aphid","sa":"+","sb":"+","rel":"Mutualisme","fa":"Sosiale insekter som lever i kolonier. Mange arter spiser energirik, sukkerholdig væske. Arbeiderne kan være aggressive mot små rovdyr og andre dyr som kommer inn i området de oppholder seg i.","fb":"Små insekter som suger plantesaft fra stengler og blader. De skiller ut sukkerholdig væske og lever ofte samlet på planten. Bladlus kan bli spist av blant annet marihøner og andre små rovdyr."},{"a":"Klovnefisk","b":"Sjøanemone","ka":"old_clownfish","kb":"old_anemone","sa":"+","sb":"+","rel":"Mutualisme","fa":"En liten korallrevsfisk som kan oppholde seg mellom tentaklene til enkelte sjøanemoner uten å bli brent. Der kan fisken finne skjul, og rester fra fiskens aktivitet kan bli tilgjengelige for anemonen.","fb":"Et fastsittende nesledyr med tentakler som kan svi og fange smådyr. Enkelte fiskearter tåler tentaklene og oppholder seg tett inntil anemonen."},{"a":"Epifyttisk orkidé","b":"Tre","ka":"old_orchid","kb":"old_tree","sa":"+","sb":"0","rel":"Kommensalisme","fa":"En orkidé som vokser oppe på andre planter uten å ha røttene i bakken. Den bruker greiner og stammer som feste og får dermed tilgang til et voksested med lys.","fb":"En stor vedplante med stamme og greiner. Andre små planter kan vokse på barken uten å hente næring fra treets vev."},{"a":"Remora","b":"Hai","ka":"old_remora","kb":"old_shark","sa":"+","sb":"0","rel":"Kommensalisme","fa":"En havfisk med en sugeskive på hodet. Den kan feste seg til større dyr og på den måten få transport og tilgang til matrester i vannet rundt dem.","fb":"En stor bruskfisk som svømmer over lange avstander. Små fisk kan i enkelte tilfeller feste seg på kroppen uten at haien får noen tydelig gevinst eller kostnad."},{"a":"Rur","b":"Hval","ka":"old_barnacle","kb":"old_whale","sa":"+","sb":"0","rel":"Kommensalisme","fa":"Et lite krepsdyr som som voksen sitter fast på harde overflater og filtrerer mat fra vannet. Et bevegelig underlag kan føre det gjennom vann med stadig ny tilgang på næringspartikler.","fb":"Et stort sjøpattedyr som svømmer lange avstander. Små fastsittende organismer kan vokse på hudoverflaten uten vanligvis å hente næring fra selve hvalen."},{"a":"Mose","b":"Tre","ka":"old_moss","kb":"old_tree","sa":"+","sb":"0","rel":"Kommensalisme","fa":"En liten plante som kan vokse på bark og andre fuktige overflater. Når den vokser på et tre, bruker den først og fremst barken som voksested og tar opp vann fra omgivelsene.","fb":"En stor vedplante med bark, stamme og greiner. Små planter kan bruke barken som voksested uten å hente næring fra treets vev."},{"a":"Flått","b":"Hjort","ka":"old_tick","kb":"old_stag","sa":"+","sb":"−","rel":"Parasittisme","fa":"Et lite edderkoppdyr som klatrer opp i vegetasjonen og kan feste seg til forbipasserende dyr. Der suger den blod for å få næring.","fb":"Et stort hjortedyr som beveger seg gjennom skog, kratt og gressområder. Små blodsugende dyr kan feste seg til huden og ta næring fra kroppen."},{"a":"Lakselus","b":"Laks","ka":"old_louse","kb":"old_salmon","sa":"+","sb":"−","rel":"Parasittisme","fa":"Et lite krepsdyr som i deler av livssyklusen fester seg til laksefisk. Der lever det av slim, hud og vev fra fisken.","fb":"En fisk som vandrer mellom ferskvann og hav. I sjøen kan små krepsdyr feste seg til hudoverflaten og gi sår og andre belastninger."},{"a":"Gjøk","b":"Heipiplerke","ka":"old_cuckoo","kb":"old_meadowpipit","sa":"+","sb":"−","rel":"Parasittisme","fa":"En trekkfugl som ikke alltid bygger og bruker eget reir til ungene. Hunnen kan legge egg i reiret til andre småfugler, som deretter bruker tid og mat på ungen.","fb":"En liten fugl som bygger reir på bakken og mater ungene sine. Den kan ende med å ruge ut og mate en unge som ikke er dens egen."},{"a":"Misteltein","b":"Tre","ka":"old_mistletoe","kb":"old_tree","sa":"+","sb":"−","rel":"Parasittisme","fa":"En eviggrønn plante som vokser på greinene til enkelte løvtrær. Den har egne grønne blader, men sender strukturer inn i vertens vev for å hente vann og mineralstoffer.","fb":"En stor vedplante som transporterer vann og mineralstoffer fra røttene gjennom ledningsvev i stammen og greinene. Planter som kobler seg til dette vevet kan hente ressurser derfra."},{"a":"Hubro","b":"Markmus","ka":"new_owl","kb":"new_vole","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"Europas største ugle. Den jakter hovedsakelig i skumringen og om natten og har svært god hørsel. Hubroen er et rovdyr som fanger små og mellomstore dyr med kraftige klør.","fb":"En liten planteetende gnager som lever på bakken, særlig i områder med mye gress. Den lager ganger og skjul i vegetasjonen og er mest aktiv nær bakken."},{"a":"Kongeørn","b":"Hare","ka":"new_eagle","kb":"new_hare","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"En stor rovfugl med svært godt syn, kraftige klør og krokete nebb. Den leter etter byttedyr fra lufta eller fra utkikksposter og kan fange dyr på bakken.","fb":"Et planteetende pattedyr som lever på bakken. Den spiser blant annet gress, urter, kvister og bark. Lange og kraftige bakbein gjør at den kan komme raskt opp i fart."},{"a":"Marihøne","b":"Bladlus","ka":"new_ladybird","kb":"new_aphid","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"En liten bille som ofte beveger seg rundt på blader og stengler. Mange arter er rovdyr både som larver og voksne og jakter særlig på små, langsomme insekter.","fb":"Svært små insekter som ofte sitter i grupper på blader og unge skudd. De beveger seg forholdsvis lite og bruker sugende munndeler til å hente næring fra planter."},{"a":"Edderkopp","b":"Flue","ka":"new_spider","kb":"new_fly","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"Et rovdyr med åtte bein. Mange arter lager klebrige nett som fanger små dyr som beveger seg gjennom lufta. Andre arter jakter aktivt uten nett.","fb":"Et lite insekt med ett par vinger. Fluer flyr mye mellom ulike steder på jakt etter mat og steder å legge egg."},{"a":"Spekkhogger","b":"Sel","ka":"new_orca","kb":"new_seal","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"Et stort og kraftig sjøpattedyr i delfinfamilien. Den har tenner, lever i grupper og er et rovdyr. Noen bestander jakter på relativt store dyr nær havoverflaten og langs iskanten.","fb":"Et sjøpattedyr som er godt tilpasset livet i vann. Den må opp til overflaten for å puste og kan hvile på land eller is. Den lever hovedsakelig av fisk og andre marine dyr."},{"a":"Gran","b":"Furu","ka":"new_spruce","kb":"new_pine","sa":"−","sb":"−","rel":"Konkurranse","fa":"Et eviggrønt bartre som kan vokse tett og bli høyt. For å vokse trenger det blant annet sollys, vann, mineralnæring og plass til røtter og greiner.","fb":"Et eviggrønt bartre som finnes i mange av de samme skogområdene som gran. Det trenger de samme grunnleggende ressursene, men klarer seg ofte bedre på tørre og næringsfattige voksesteder."},{"a":"Løve","b":"Gepard","ka":"new_lion","kb":"new_cheetah","sa":"−","sb":"−","rel":"Konkurranse","fa":"Et stort rovdyr på afrikanske savanner og gressletter. Det jakter hovedsakelig på planteetende hovdyr og kan bevege seg over store områder for å finne mat.","fb":"Et rovdyr som særlig lever i åpne områder i Afrika. Det bruker høy fart til å jakte på planteetende hovdyr og trenger åpne jaktområder med tilgang på byttedyr."},{"a":"Honningbie","b":"Epletre","ka":"new_bee","kb":"new_apple","sa":"+","sb":"+","rel":"Mutualisme","fa":"Et sosialt insekt. Arbeiderne flyr mellom blomster og samler nektar og pollen som mat. Pollenkorn fester seg lett til hårene på kroppen og kan bli med videre når bien besøker nye blomster.","fb":"Et løvtre som blomstrer om våren. Blomstene produserer nektar og pollen. For at frø og senere epler skal utvikles, må pollen komme fram til blomstens hunnlige deler."},{"a":"Akasiemaur","b":"Akasie","ka":"new_ant","kb":"new_acacia","sa":"+","sb":"+","rel":"Mutualisme","fa":"En maur som lever i kolonier. Arbeiderne forsvarer området der kolonien holder til og kan angripe planteetende insekter og andre dyr som forsøker å spise vegetasjonen der. Maurene trenger både energirik mat og et beskyttet sted for kolonien.","fb":"Enkelte akasiearter har store, hule torner og små strukturer som produserer næringsrik mat som insekter kan spise. Som andre planter kan akasien miste blader og unge skudd når planteetere beiter på den."},{"a":"Pussefisk","b":"Stor revfisk","ka":"new_cleaner","kb":"new_reeffish","sa":"+","sb":"+","rel":"Mutualisme","fa":"En liten fisk som lever på korallrev. Den spiser små krepsdyr og annet organisk materiale som den plukker fra overflater. Mange holder til på faste steder som de vender tilbake til.","fb":"En større fisk som lever på korallrev. Små parasitter kan feste seg til hud og gjeller og hente næring der. Enkelte revfisk oppsøker bestemte steder og kan stå uvanlig stille med utspilte finner eller åpen munn."},{"a":"Storfehegre","b":"Storfe","ka":"new_egret","kb":"new_cattle","sa":"+","sb":"0","rel":"Kommensalisme","fa":"En liten hegrefugl som finnes i varme og tempererte områder i store deler av verden. Den lever særlig av insekter og andre smådyr på bakken. Den søker ofte etter mat i områder der vegetasjonen er i bevegelse, fordi smådyr da blir lettere å oppdage.","fb":"Store planteetende pattedyr som bruker mye tid på å gå og beite i gressområder. Når de beveger seg gjennom vegetasjonen, bøyer og tråkker de planter og får smådyr i gresset til å bevege seg."},{"a":"Snylteveps","b":"Sommerfugllarve","ka":"new_wasp","kb":"new_caterpillar","sa":"+","sb":"−","rel":"Parasittisme","fa":"En stor gruppe små veps. Hos mange arter må larven utvikle seg på eller inne i kroppen til et annet dyr, der den får tilgang til næring mens den vokser. Den voksne hunnen bruker sanseorganer til å finne egnede verter for eggene sine.","fb":"Vekststadiet mellom egg og puppe hos sommerfugler. Larven spiser mye og bygger opp kroppsvev og energilagre. Kroppen inneholder derfor næring som larven trenger for å vokse og senere utvikle seg videre."},{"a":"Bendelorm","b":"Rev","ka":"new_tapeworm","kb":"new_fox","sa":"+","sb":"−","rel":"Parasittisme","fa":"En flatorm som ikke har eget fordøyelsessystem. Den må leve inne i et annet dyr og tar opp ferdig fordøyde næringsstoffer direkte gjennom kroppsoverflaten.","fb":"Et mellomstort rovpattedyr som spiser variert kost. Maten brytes ned i fordøyelsessystemet, og næringsstoffer tas normalt opp gjennom tarmveggen og brukes av kroppen."}];
let mode='',count=10,questions=[],idx=0,points=0,selected='',signA='',signB='',locked=false;
const $=id=>document.getElementById(id);function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('sel',x===b));$('start').disabled=false;$('start').textContent='Start'});function setCount(v){count=Math.max(1,Math.min(ALL.length,v));$('count').textContent=count}$('minus').onclick=()=>setCount(count-1);$('plus').onclick=()=>setCount(count+1);
$('start').onclick=()=>{questions=shuffle(ALL).slice(0,count);idx=0;points=0;$('menu').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');$('modeLabel').textContent=mode==='advanced'?'Avansert nivå':'Enkelt nivå';render()};
function relationButtons(){return `<div class="choices">${['Konkurranse','Bytte–rovdyr','Symbiose'].map(x=>`<button class="choice" data-rel="${x}">${x}</button>`).join('')}</div><div id="subs" class="subs">${['Mutualisme','Kommensalisme','Parasittisme'].map(x=>`<button class="subchoice" data-sub="${x}">${x}</button>`).join('')}</div>`}
function signControl(which,val){return mode==='advanced'?`<select class="signselect" id="sign${which}" aria-label="Virkning på art ${which}"><option value="">?</option><option>+</option><option>−</option><option>0</option></select>`:`<span class="signbadge">${val}</span>`}
function render(){const q=questions[idx];selected='';signA='';signB='';locked=false;$('prog').textContent=`Oppgave ${idx+1} av ${questions.length}`;$('score').textContent=`${points} poeng`;$('bar').style.width=`${100*idx/questions.length}%`;$('main').innerHTML=`<section class="pair"><div class="species"><div class="pic"><img src="${ASSETS[q.ka]}" alt="${q.a}"></div><div class="species-title"><span>${q.a}</span><button class="info" data-name="${q.a}" data-text="a" aria-label="Informasjon om ${q.a}">i</button></div></div><div class="middle"><div class="signrow">${signControl('A',q.sa)}<span class="arrow">↔</span>${signControl('B',q.sb)}</div><div class="hint">+ fordel &nbsp; − ulempe &nbsp; 0 omtrent upåvirket</div></div><div class="species"><div class="pic"><img src="${ASSETS[q.kb]}" alt="${q.b}"></div><div class="species-title"><span>${q.b}</span><button class="info" data-name="${q.b}" data-text="b" aria-label="Informasjon om ${q.b}">i</button></div></div></section><section class="card"><h2>${mode==='advanced'?'Bestem virkningen og samspillet':'Hvilket samspill er dette?'}</h2>${relationButtons()}<div id="feedback" class="feedback"></div><div class="actions"><button id="check" class="btn">Sjekk svar</button><button id="next" class="btn hidden">${idx===questions.length-1?'Se resultat':'Neste →'}</button></div></section>`;
 document.querySelectorAll('.info').forEach(b=>b.onclick=()=>{const isA=b.dataset.text==='a';$('mt').textContent=isA?q.a:q.b;$('mb').textContent=isA?q.fa:q.fb;$('modal').classList.add('show')});
 document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(locked)return;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(b.dataset.rel==='Symbiose'){$('subs').classList.add('show');selected=''}else{$('subs').classList.remove('show');document.querySelectorAll('.subchoice').forEach(x=>x.classList.remove('sel'));selected=b.dataset.rel}});
 document.querySelectorAll('.subchoice').forEach(b=>b.onclick=()=>{if(locked)return;document.querySelectorAll('.subchoice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=b.dataset.sub});$('check').onclick=check;$('next').onclick=next}
function check(){const q=questions[idx];if(mode==='advanced'){signA=$('signA').value;signB=$('signB').value;if(!signA||!signB||!selected){showMsg('Velg +, − eller 0 for begge artene, og velg typen samspill.','no');return}}else if(!selected){showMsg('Velg typen samspill.','no');return}const relok=selected===q.rel;const signok=mode==='simple'||(signA===q.sa&&signB===q.sb);const ok=relok&&signok;if(ok)points++;locked=true;document.querySelectorAll('.choice,.subchoice').forEach(x=>x.disabled=true);if(mode==='advanced'){$('signA').disabled=true;$('signB').disabled=true}let msg=ok?'<b>Riktig!</b>':`<b>Ikke helt.</b> Riktig svar er ${mode==='advanced'?`<b>${q.a}: ${q.sa}</b>, <b>${q.b}: ${q.sb}</b> og `:''}<b>${q.rel}</b>.`;showMsg(msg,ok?'ok':'no');$('check').classList.add('hidden');$('next').classList.remove('hidden');$('score').textContent=`${points} poeng`;}
function showMsg(t,c){const f=$('feedback');f.innerHTML=t;f.className='feedback show '+c}function next(){idx++;if(idx<questions.length)render();else finish()}function finish(){$('game').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML=`<h1>Ferdig!</h1><div class="bigscore">${points} / ${questions.length}</div><p>Du svarte på ${questions.length} tilfeldig valgte samspill på ${mode==='advanced'?'avansert':'enkelt'} nivå.</p><button class="btn" id="again">Ny runde</button>`;$('again').onclick=()=>{$('result').classList.add('hidden');$('menu').classList.remove('hidden')}}$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
</script></body></html>
