
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kjemi - periodesystemet</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background: #f5f7f8;
    color: #20252b;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 720px;
    padding: 30px;
}

/* ---------------- HEADER ---------------- */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 28px;
}

.title {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.chem-logo {
    width: 34px;
    height: 34px;
    flex: 0 0 auto;
    display: block;
}

.progress {
    font-size: 14px;
    color: #6b737c;
}

/* ---------------- CARD ---------------- */

.card {
    background: white;

    border-radius: 18px;

    padding: 48px;

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.06);
}

/* ---------------- OPPGAVE ---------------- */

.topic {
    font-size: 14px;
    color: #66727d;

    margin-bottom: 24px;

    letter-spacing: 0.5px;
}

.element {
    font-size: 42px;
    font-weight: 600;

    margin-bottom: 28px;
}

.question {
    font-size: 22px;
    line-height: 1.45;

    margin-bottom: 28px;
}

/* ---------------- INPUT ---------------- */

input {
    width: 100%;

    padding: 15px 16px;

    font-size: 20px;

    border: 1px solid #cfd5da;
    border-radius: 10px;

    outline: none;
}

input:focus {
    border-color: #667f91;
}

/* ---------------- KJEMI-EDITOR FOR IONER ---------------- */

.ion-editor {
    display: none;
    padding: 16px;
    border: 1px solid #cfd5da;
    border-radius: 12px;
    background: #f8fafb;
}

.ion-editor-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

.ion-symbol-input {
    width: 110px;
    text-align: center;
}

.ion-preview {
    min-width: 90px;
    padding: 12px 16px;
    background: white;
    border: 1px solid #d9dee2;
    border-radius: 10px;
    font-size: 28px;
    text-align: center;
    font-style: normal;
}

.ion-preview sup {
    font-size: 0.62em;
    line-height: 0;
}

.charge-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.charge-button {
    margin-top: 0;
    padding: 9px 12px;
    min-width: 44px;
    background: #e9eef1;
    color: #26343d;
    border: 1px solid #cfd7dc;
}

.charge-button:hover, .charge-button.selected {
    background: #405968;
    color: white;
}

.ion-editor-help {
    margin-top: 10px;
    font-size: 13px;
    color: #6b737c;
}

/* ---------------- KNAPPER ---------------- */

button {
    margin-top: 16px;

    padding: 13px 22px;

    border: none;
    border-radius: 10px;

    background: #405968;
    color: white;

    font-size: 16px;

    cursor: pointer;
}

button:hover {
    background: #334955;
}

button:disabled {
    cursor: default;
}

/* ---------------- FEEDBACK ---------------- */

.feedback {
    margin-top: 24px;

    padding-top: 20px;

    border-top: 1px solid #e5e8eb;

    font-size: 17px;
    line-height: 1.5;
}

.feedback strong {
    font-weight: 600;
}

.next {
    display: none;
}

/* ---------------- SLUTT ---------------- */

.resultat {
    display: none;
}

.resultat-tittel {
    font-size: 30px;
    font-weight: 600;

    margin-bottom: 20px;
}

.poeng {
    font-size: 22px;

    margin-bottom: 28px;
}

.forbedre {
    font-size: 17px;
    line-height: 1.6;
}

/* ---------------- STARTMENY ---------------- */

.menu-title {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 10px;
}
.menu-intro {
    color: #66727d;
    line-height: 1.5;
    margin-bottom: 26px;
}
.menu-option {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0;
    font-size: 17px;
}
.menu-option input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin: 0;
}
.menu-field {
    margin-top: 22px;
}
.menu-field label {
    display: block;
    font-size: 15px;
    color: #66727d;
    margin-bottom: 8px;
}
.menu-field select {
    width: 100%;
    padding: 13px 14px;
    font-size: 17px;
    border: 1px solid #cfd5da;
    border-radius: 10px;
    background: white;
}

/* ---------------- FOOTER ---------------- */

.footer {
    text-align: center;

    margin-top: 24px;

    font-size: 13px;

    color: #8a9299;
}

</style>
</head>


<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="title">
            <svg class="chem-logo" viewBox="0 0 64 64" aria-hidden="true">
                <g fill="none" stroke="#405968" stroke-width="2.4" stroke-linecap="round">
                    <ellipse cx="32" cy="32" rx="25" ry="9" transform="rotate(0 32 32)"/>
                    <ellipse cx="32" cy="32" rx="25" ry="9" transform="rotate(60 32 32)"/>
                    <ellipse cx="32" cy="32" rx="25" ry="9" transform="rotate(120 32 32)"/>
                </g>
                <circle cx="32" cy="32" r="5.5" fill="#405968"/>
                <circle cx="57" cy="32" r="3.5" fill="#667f91"/>
                <circle cx="19.5" cy="10.4" r="3.5" fill="#667f91"/>
                <circle cx="19.5" cy="53.6" r="3.5" fill="#667f91"/>
            </svg>
            KJEMI
        </div>

        <div class="progress" id="progress">
            Velg økt
        </div>

    </div>


    <!-- STARTMENY -->

    <div class="card" id="startmeny">
        <div class="menu-title">Velg økt</div>
        <div class="menu-intro">Velg hva du vil øve på og hvor mange oppgaver du ønsker.</div>

        <label class="menu-option">
            <input type="checkbox" id="kun20" checked>
            <span>Kun de 20 første grunnstoffene</span>
        </label>

        <label class="menu-option">
            <input type="checkbox" id="inkluderIoner">
            <span>Inkluder ioner</span>
        </label>

        <label class="menu-option">
            <input type="checkbox" id="kunIoner">
            <span>Kun ioner</span>
        </label>

        <div class="menu-field">
            <label for="antallOppgaver">Antall oppgaver</label>
            <select id="antallOppgaver">
                <option value="5">5 oppgaver</option>
                <option value="10">10 oppgaver</option>
                <option value="15" selected>15 oppgaver</option>
                <option value="20">20 oppgaver</option>
                <option value="25">25 oppgaver</option>
                <option value="30">30 oppgaver</option>
                <option value="40">40 oppgaver</option>
                <option value="50">50 oppgaver</option>
            </select>
        </div>

        <button onclick="startØkt()">Start økt →</button>
    </div>

    <!-- OPPGAVEKORT -->

    <div class="card" id="oppgaveKort" style="display:none">

        <div class="topic">
            PERIODESYSTEMET
        </div>

        <div class="element" id="element">
            Magnesium
        </div>

        <div class="question" id="question">
            Hva er symbolet for magnesium?
        </div>

        <input
            id="svar"
            type="text"
            placeholder="Skriv svaret her"
            autocomplete="off"
        >

        <div id="ionEditor" class="ion-editor">
            <div class="ion-editor-row">
                <input id="ionSymbol" class="ion-symbol-input" type="text" maxlength="2"
                       placeholder="Symbol" autocomplete="off" aria-label="Grunnstoffsymbol">
                <div id="ionPreview" class="ion-preview" aria-live="polite">—</div>
            </div>
            <div class="charge-buttons" id="chargeButtons" aria-label="Velg ioneladning">
                <button type="button" class="charge-button" data-charge="1" onclick="velgLadning(1)">⁺</button>
                <button type="button" class="charge-button" data-charge="2" onclick="velgLadning(2)">²⁺</button>
                <button type="button" class="charge-button" data-charge="3" onclick="velgLadning(3)">³⁺</button>
                <button type="button" class="charge-button" data-charge="-1" onclick="velgLadning(-1)">⁻</button>
                <button type="button" class="charge-button" data-charge="-2" onclick="velgLadning(-2)">²⁻</button>
                <button type="button" class="charge-button" data-charge="-3" onclick="velgLadning(-3)">³⁻</button>
            </div>
            <div class="ion-editor-help">Skriv grunnstoffsymbolet og velg ladning. Svaret vises med korrekt kjemisk notasjon.</div>
        </div>

        <button id="sjekk" onclick="sjekkSvar()">
            Sjekk svar
        </button>

        <div id="feedback" class="feedback"></div>

        <button
            id="neste"
            class="next"
            onclick="nesteOppgave()">
            Neste oppgave →
        </button>

    </div>


    <!-- RESULTAT -->

    <div class="card resultat" id="resultat">

        <div class="resultat-tittel">
            Ferdig!
        </div>

        <div class="poeng" id="poeng">
        </div>

        <div class="forbedre" id="forbedre">
        </div>

        <button onclick="startPåNytt()">
            Start på nytt
        </button>

    </div>


    <div class="footer">
        Bruk periodesystemet aktivt.
    </div>

</div>


<script>


/* =========================================================
   GRUNNSTOFFER
   ========================================================= */

const grunnstoffer = [

    { navn: "Hydrogen", symbol: "H", atomnummer: 1, ytterelektroner: 1, ioner: [{ladning: 1}, {ladning: -1}] },

    { navn: "Helium", symbol: "He", atomnummer: 2, ytterelektroner: 2 },

    { navn: "Litium", symbol: "Li", atomnummer: 3, ytterelektroner: 1, ioner: [{ladning: 1}] },

    { navn: "Beryllium", symbol: "Be", atomnummer: 4, ytterelektroner: 2, ioner: [{ladning: 2}] },

    { navn: "Bor", symbol: "B", atomnummer: 5, ytterelektroner: 3, ioner: [{ladning: 3}] },

    { navn: "Karbon", symbol: "C", atomnummer: 6, ytterelektroner: 4 },

    { navn: "Nitrogen", symbol: "N", atomnummer: 7, ytterelektroner: 5, ioner: [{ladning: -3}] },

    { navn: "Oksygen", symbol: "O", atomnummer: 8, ytterelektroner: 6, ioner: [{ladning: -2}] },

    { navn: "Fluor", symbol: "F", atomnummer: 9, ytterelektroner: 7, ioner: [{ladning: -1}] },

    { navn: "Neon", symbol: "Ne", atomnummer: 10, ytterelektroner: 8 },

    { navn: "Natrium", symbol: "Na", atomnummer: 11, ytterelektroner: 1, ioner: [{ladning: 1}] },

    { navn: "Magnesium", symbol: "Mg", atomnummer: 12, ytterelektroner: 2, ioner: [{ladning: 2}] },

    { navn: "Aluminium", symbol: "Al", atomnummer: 13, ytterelektroner: 3, ioner: [{ladning: 3}] },

    { navn: "Silisium", symbol: "Si", atomnummer: 14, ytterelektroner: 4 },

    { navn: "Fosfor", symbol: "P", atomnummer: 15, ytterelektroner: 5, ioner: [{ladning: -3}] },

    { navn: "Svovel", symbol: "S", atomnummer: 16, ytterelektroner: 6, ioner: [{ladning: -2}] },

    { navn: "Klor", symbol: "Cl", atomnummer: 17, ytterelektroner: 7, ioner: [{ladning: -1}] },

    { navn: "Argon", symbol: "Ar", atomnummer: 18, ytterelektroner: 8 },

    { navn: "Kalium", symbol: "K", atomnummer: 19, ytterelektroner: 1, ioner: [{ladning: 1}] },

    { navn: "Kalsium", symbol: "Ca", atomnummer: 20, ytterelektroner: 2, ioner: [{ladning: 2}] },

    { navn: "Gallium", symbol: "Ga", atomnummer: 31, ytterelektroner: 3, ioner: [{ladning: 3}] },

    { navn: "Germanium", symbol: "Ge", atomnummer: 32, ytterelektroner: 4 },

    { navn: "Arsen", symbol: "As", atomnummer: 33, ytterelektroner: 5, ioner: [{ladning: -3}] },

    { navn: "Selen", symbol: "Se", atomnummer: 34, ytterelektroner: 6, ioner: [{ladning: -2}] },

    { navn: "Brom", symbol: "Br", atomnummer: 35, ytterelektroner: 7, ioner: [{ladning: -1}] },

    { navn: "Krypton", symbol: "Kr", atomnummer: 36, ytterelektroner: 8 }

];


/* =========================================================
   OPPGAVETYPER
   ========================================================= */

const oppgavetyper = [

    "symbol",
    "atomnummer",
    "protoner",
    "elektroner",
    "ytterelektroner"

];


/* =========================================================
   VARIABLER
   ========================================================= */

let oppgaver = [];

let oppgaveNr = 0;

let poeng = 0;

let ferdig = false;

let antallValgt = 15;
let brukKun20 = true;
let brukIoner = false;
let brukKunIoner = false;

let statistikk = {
    symbol: { riktig: 0, totalt: 0 },
    atomnummer: { riktig: 0, totalt: 0 },
    protoner: { riktig: 0, totalt: 0 },
    elektroner: { riktig: 0, totalt: 0 },
    ytterelektroner: { riktig: 0, totalt: 0 },
    ion: { riktig: 0, totalt: 0 },
    ionelektroner: { riktig: 0, totalt: 0 }
};


/* =========================================================
   HJELPEFUNKSJONER
   ========================================================= */

function bland(array) {

    return [...array].sort(() => Math.random() - 0.5);

}


/* =========================================================
   LAG OPPGAVER
   ========================================================= */

function lagOppgaver() {

    const tilgjengelige = brukKun20
        ? grunnstoffer.filter(e => e.atomnummer <= 20)
        : grunnstoffer;

    let typer;

    if (brukKunIoner) {
        typer = ["ion", "ionelektroner"];
    } else {
        typer = [...oppgavetyper];
        if (brukIoner) {
            typer.push("ion", "ionelektroner");
        }
    }

    const nyeOppgaver = [];

    for (let i = 0; i < antallValgt; i++) {
        let type = typer[Math.floor(Math.random() * typer.length)];
        let kandidater = tilgjengelige;

        if (type === "ion" || type === "ionelektroner") {
            kandidater = tilgjengelige.filter(e => e.ioner && e.ioner.length > 0);
            if (kandidater.length === 0) type = "symbol";
        }

        const element = kandidater[Math.floor(Math.random() * kandidater.length)];
        const oppgave = { element, type };

        if (type === "ion" || type === "ionelektroner") {
            oppgave.ion = element.ioner[Math.floor(Math.random() * element.ioner.length)];
        }

        nyeOppgaver.push(oppgave);
    }

    return nyeOppgaver;
}



function ionSvar(element, ion) {
    if (!ion) return element.symbol;
    const l = ion.ladning;
    const tegn = l > 0 ? "+" : "−";
    const tall = Math.abs(l) === 1 ? "" : Math.abs(l);
    return element.symbol + tall + tegn;
}

function ionTekst(element, ion) {
    if (!ion) return element.symbol;
    const l = ion.ladning;
    const tegn = l > 0 ? "+" : "−";
    const tall = Math.abs(l) === 1 ? "" : Math.abs(l);
    return element.symbol + "<sup>" + tall + tegn + "</sup>";
}

/* =========================================================
   TEKST TIL OPPGAVEN
   ========================================================= */

function hentSpørsmål(type, element, ion) {

    if (type === "symbol") {

        return "Hva er symbolet for " +
               element.navn.toLowerCase() +
               "?";

    }

    if (type === "atomnummer") {

        return "Hva er atomnummeret til " +
               element.navn.toLowerCase() +
               "?";

    }

    if (type === "protoner") {

        return "Hvor mange protoner har " +
               element.navn.toLowerCase() +
               "?";

    }

    if (type === "elektroner") {

        return "Hvor mange elektroner har et nøytralt atom av " +
               element.navn.toLowerCase() +
               "?";

    }

    if (type === "ytterelektroner") {

        return "Hvor mange elektroner er det i ytterste skall hos " +
               element.navn.toLowerCase() +
               "?";

    }

    if (type === "ion") {
        return "Skriv formelen for det vanlige ionet av " + element.navn.toLowerCase() + ".";
    }

    if (type === "ionelektroner") {
        return "Hvor mange elektroner har ionet " + ionTekst(element, ion) + "?";
    }

}


/* =========================================================
   RIKTIG SVAR
   ========================================================= */

function hentRiktigSvar(type, element, ion) {

    if (type === "symbol") {
        return element.symbol;
    }

    if (type === "atomnummer") {
        return String(element.atomnummer);
    }

    if (type === "protoner") {
        return String(element.atomnummer);
    }

    if (type === "elektroner") {
        return String(element.atomnummer);
    }

    if (type === "ytterelektroner") {
        return String(element.ytterelektroner);
    }

    if (type === "ion") {
        return ionSvar(element, ion);
    }

    if (type === "ionelektroner") {
        return String(element.atomnummer - ion.ladning);
    }

}


/* =========================================================
   FORKLARING
   ========================================================= */

function hentForklaring(type, element, ion) {

    if (type === "symbol") {

        return "Symbolet for " +
               element.navn.toLowerCase() +
               " er <strong>" +
               element.symbol +
               "</strong>.";

    }


    if (type === "atomnummer") {

        return element.navn +
               " har atomnummer <strong>" +
               element.atomnummer +
               "</strong>.";

    }


    if (type === "protoner") {

        return "Atomnummeret viser hvor mange protoner " +
               "grunnstoffet har. " +
               element.navn +
               " har derfor <strong>" +
               element.atomnummer +
               "</strong> protoner.";

    }


    if (type === "elektroner") {

        return "Et nøytralt atom har like mange elektroner " +
               "som protoner. " +
               element.navn +
               " har derfor <strong>" +
               element.atomnummer +
               "</strong> elektroner.";

    }


    if (type === "ytterelektroner") {

        return element.navn +
               " har <strong>" +
               element.ytterelektroner +
               "</strong> elektroner i ytterste skall.";

    }

    if (type === "ion") {
        const l = ion.ladning;
        const handling = l > 0 ? "avgitt " + l : "tatt opp " + Math.abs(l);
        return element.navn + " kan her danne <strong>" + ionTekst(element, ion) +
               "</strong>. Det betyr at atomet har " + handling + " elektron" +
               (Math.abs(l) === 1 ? "" : "er") + ".";
    }

    if (type === "ionelektroner") {
        const antall = element.atomnummer - ion.ladning;
        const handling = ion.ladning > 0 ? "mistet " + ion.ladning : "fått " + Math.abs(ion.ladning);
        return "Et nøytralt " + element.navn.toLowerCase() + "atom har " + element.atomnummer +
               " elektroner. I " + ionTekst(element, ion) + " har det " + handling +
               " elektron" + (Math.abs(ion.ladning) === 1 ? "" : "er") +
               " og har derfor <strong>" + antall + "</strong> elektroner.";
    }

}


let valgtIonLadning = null;

function ladningSomHTML(ladning) {
    const tegn = ladning > 0 ? "+" : "−";
    const tall = Math.abs(ladning) === 1 ? "" : Math.abs(ladning);
    return "<sup>" + tall + tegn + "</sup>";
}

function oppdaterIonPreview() {
    const symbol = document.getElementById("ionSymbol").value.trim();
    const preview = document.getElementById("ionPreview");
    if (!symbol && valgtIonLadning === null) {
        preview.innerHTML = "—";
        return;
    }
    const rentSymbol = symbol.replace(/[^A-Za-z]/g, "").slice(0, 2);
    preview.innerHTML = rentSymbol + (valgtIonLadning === null ? "" : ladningSomHTML(valgtIonLadning));
}

function velgLadning(ladning) {
    if (ferdig) return;
    valgtIonLadning = ladning;
    document.querySelectorAll(".charge-button").forEach(knapp => {
        knapp.classList.toggle("selected", Number(knapp.dataset.charge) === ladning);
    });
    oppdaterIonPreview();
}

function hentIonEditorSvar() {
    const symbol = document.getElementById("ionSymbol").value.trim();
    if (!symbol || valgtIonLadning === null) return null;
    return { symbol, ladning: valgtIonLadning };
}

document.getElementById("ionSymbol").addEventListener("input", function() {
    this.value = this.value.replace(/[^A-Za-z]/g, "").slice(0, 2);
    oppdaterIonPreview();
});

/* =========================================================
   VIS OPPGAVE
   ========================================================= */

function visOppgave() {

    ferdig = false;

    const oppgave = oppgaver[oppgaveNr];

    document.getElementById("progress").textContent =
        "Oppgave " +
        (oppgaveNr + 1) +
        " av " +
        oppgaver.length;

    document.getElementById("element").textContent =
        oppgave.element.navn;

    document.getElementById("question").innerHTML =
        hentSpørsmål(
            oppgave.type,
            oppgave.element,
            oppgave.ion
        );

    const felt = document.getElementById("svar");

    felt.value = "";
    felt.disabled = false;

    const ionEditor = document.getElementById("ionEditor");
    const ionSymbol = document.getElementById("ionSymbol");
    valgtIonLadning = null;
    ionSymbol.value = "";
    ionSymbol.disabled = false;
    document.querySelectorAll(".charge-button").forEach(knapp => {
        knapp.classList.remove("selected");
        knapp.disabled = false;
    });
    oppdaterIonPreview();

    if (oppgave.type === "ion") {
        felt.style.display = "none";
        ionEditor.style.display = "block";
        setTimeout(() => ionSymbol.focus(), 0);
    } else {
        felt.style.display = "block";
        ionEditor.style.display = "none";
        felt.focus();
    }

    document.getElementById("sjekk").style.display =
        "inline-block";

    document.getElementById("neste").style.display =
        "none";

    document.getElementById("feedback").innerHTML =
        "";
}


/* =========================================================
   SJEKK SVAR
   ========================================================= */

function sjekkSvar() {

    if (ferdig) {
        return;
    }

    const oppgave = oppgaver[oppgaveNr];

    const felt = document.getElementById("svar");

    let svar = felt.value.trim();

    const riktigSvar =
        hentRiktigSvar(
            oppgave.type,
            oppgave.element,
            oppgave.ion
        );


    /*
       Symboler behandles uten hensyn til store/små bokstaver.
    */

    let erRiktig = false;

    if (oppgave.type === "symbol") {

        erRiktig = svar.toLowerCase() === riktigSvar.toLowerCase();

    } else if (oppgave.type === "ion") {

        const ionSvarFraEditor = hentIonEditorSvar();
        erRiktig = ionSvarFraEditor !== null &&
            ionSvarFraEditor.symbol.toLowerCase() === oppgave.element.symbol.toLowerCase() &&
            ionSvarFraEditor.ladning === oppgave.ion.ladning;

    } else {

        erRiktig =
            svar === riktigSvar;

    }


    /*
       Registrer statistikk.
    */

    statistikk[oppgave.type].totalt++;


    if (erRiktig) {

        poeng++;

        statistikk[oppgave.type].riktig++;

    }


    /*
       Vis tilbakemelding.
    */

    const feedback =
        document.getElementById("feedback");


    if (erRiktig) {

        feedback.innerHTML =
            "<strong>Riktig!</strong><br>" +
            hentForklaring(
                oppgave.type,
                oppgave.element,
                oppgave.ion
            );

    } else {

        feedback.innerHTML =
            "<strong>Ikke helt.</strong><br>" +
            "Riktig svar er <strong>" +
            (oppgave.type === "ion" ? ionTekst(oppgave.element, oppgave.ion) : riktigSvar) +
            "</strong>.<br><br>" +
            hentForklaring(
                oppgave.type,
                oppgave.element,
                oppgave.ion
            );

    }


    /*
       Ett forsøk.
    */

    ferdig = true;

    felt.disabled = true;
    document.getElementById("ionSymbol").disabled = true;
    document.querySelectorAll(".charge-button").forEach(knapp => knapp.disabled = true);

    document.getElementById("sjekk").style.display =
        "none";


    /*
       Siste oppgave?
    */

    if (oppgaveNr === oppgaver.length - 1) {

        document.getElementById("neste").textContent =
            "Se resultat →";

    } else {

        document.getElementById("neste").textContent =
            "Neste oppgave →";

    }


    document.getElementById("neste").style.display =
        "inline-block";
}


/* =========================================================
   NESTE OPPGAVE
   ========================================================= */

function nesteOppgave() {

    if (!ferdig) {
        return;
    }

    oppgaveNr++;


    if (oppgaveNr >= oppgaver.length) {

        visResultat();

        return;
    }


    visOppgave();
}


/* =========================================================
   RESULTAT
   ========================================================= */

function visResultat() {

    document.getElementById("oppgaveKort").style.display =
        "none";

    document.getElementById("resultat").style.display =
        "block";

    document.getElementById("progress").textContent =
        "Ferdig";


    document.getElementById("poeng").innerHTML =
        "Du fikk <strong>" +
        poeng +
        " av " +
        oppgaver.length +
        " riktige</strong>.";


    let forbedringer = [];


    if (
        statistikk.symbol.totalt > 0 &&
        statistikk.symbol.riktig <
        statistikk.symbol.totalt
    ) {

        forbedringer.push("symboler");

    }


    if (
        statistikk.atomnummer.totalt > 0 &&
        statistikk.atomnummer.riktig <
        statistikk.atomnummer.totalt
    ) {

        forbedringer.push("atomnummer");

    }


    if (
        statistikk.protoner.totalt > 0 &&
        statistikk.protoner.riktig <
        statistikk.protoner.totalt
    ) {

        forbedringer.push("protoner");

    }


    if (
        statistikk.elektroner.totalt > 0 &&
        statistikk.elektroner.riktig <
        statistikk.elektroner.totalt
    ) {

        forbedringer.push("elektroner");

    }


    if (
        statistikk.ytterelektroner.totalt > 0 &&
        statistikk.ytterelektroner.riktig <
        statistikk.ytterelektroner.totalt
    ) {

        forbedringer.push("elektroner i ytterste skall");

    }


    let tekst = "";


    if (forbedringer.length === 0) {

        tekst =
            "Du svarte riktig på alle oppgavetyper. " +
            "Veldig bra bruk av periodesystemet!";

    } else {

        tekst =
            "Det kan være lurt å øve litt ekstra på: " +
            "<strong>" +
            forbedringer.join(", ") +
            "</strong>.";

    }


    document.getElementById("forbedre").innerHTML =
        tekst;
}


/* =========================================================
   START PÅ NYTT
   ========================================================= */

function startØkt() {
    brukKun20 = document.getElementById("kun20").checked;
    brukKunIoner = document.getElementById("kunIoner").checked;
    brukIoner = document.getElementById("inkluderIoner").checked || brukKunIoner;
    antallValgt = Number(document.getElementById("antallOppgaver").value);

    oppgaveNr = 0;
    poeng = 0;
    statistikk = {
        symbol: { riktig: 0, totalt: 0 },
        atomnummer: { riktig: 0, totalt: 0 },
        protoner: { riktig: 0, totalt: 0 },
        elektroner: { riktig: 0, totalt: 0 },
        ytterelektroner: { riktig: 0, totalt: 0 },
        ion: { riktig: 0, totalt: 0 },
        ionelektroner: { riktig: 0, totalt: 0 }
    };

    oppgaver = lagOppgaver();
    document.getElementById("startmeny").style.display = "none";
    document.getElementById("resultat").style.display = "none";
    document.getElementById("oppgaveKort").style.display = "block";
    visOppgave();
}

function startPåNytt() {
    document.getElementById("resultat").style.display = "none";
    document.getElementById("oppgaveKort").style.display = "none";
    document.getElementById("startmeny").style.display = "block";
    document.getElementById("progress").textContent = "Velg økt";
}

const kunIonerValg = document.getElementById("kunIoner");
const inkluderIonerValg = document.getElementById("inkluderIoner");

kunIonerValg.addEventListener("change", function() {
    if (this.checked) {
        inkluderIonerValg.checked = true;
        inkluderIonerValg.disabled = true;
    } else {
        inkluderIonerValg.disabled = false;
    }
});

// Økten starter fra menyen.


/*
   Enter-tasten kan brukes for å sjekke svaret.
*/

document.getElementById("svar").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            if (!ferdig) {
                sjekkSvar();
            }

        }

    }
);

document.getElementById("ionSymbol").addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !ferdig) sjekkSvar();
});
