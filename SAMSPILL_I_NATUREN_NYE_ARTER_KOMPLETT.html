:root{--g:#173f31;--p:#f2f7f3;--l:#d8e4dc;--t:#26322c}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--t);font-family:Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:34px 24px 50px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid var(--l);padding-bottom:18px}h1{font:42px Georgia,serif;color:var(--g);margin:0 0 6px}.sub{color:#66756d}.progress{font-weight:700;color:var(--g)}.bar{height:6px;background:#e9efeb;border-radius:9px;margin:18px 0 30px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:40px;align-items:start}.species{display:grid;grid-template-columns:1fr 92px 1fr;gap:10px;align-items:center}.card{text-align:center}.pic{height:250px;display:flex;align-items:center;justify-content:center;background:#fff}.pic img{max-width:100%;max-height:100%;object-fit:contain}.name{font:25px Georgia,serif;color:var(--g);border:0;background:none;text-decoration:underline;text-underline-offset:4px;cursor:pointer}.arrowcol{display:flex;flex-direction:column;align-items:center;gap:8px}.sign{width:68px;padding:8px;border:1px solid #9fb5a8;border-radius:10px;background:#fff;color:var(--g);font-size:22px;font-weight:bold}.arrow{font-size:35px;color:var(--g)}.panel{border:1px solid var(--l);border-radius:18px;padding:26px;box-shadow:0 12px 35px #173f3112}.panel h2{font:26px Georgia,serif;color:var(--g);margin-top:0}.choices{display:grid;gap:10px}.choice{text-align:left;padding:13px 15px;border:1px solid #b8c9bf;background:#fff;border-radius:11px;font-size:16px;cursor:pointer}.choice.sel{border:2px solid var(--g);background:var(--p)}.subs{display:none;margin-left:18px;gap:8px}.subs.show{display:grid}.actions{display:flex;gap:10px;margin-top:20px;min-height:46px}.next{background:var(--g)!important;color:#fff!important}.action{border:0;border-radius:11px;padding:13px 18px;font-weight:700;cursor:pointer}.check{background:var(--g);color:#fff}.next{background:#eaf1ec;color:var(--g)}.feedback{display:none;margin-top:18px;padding:16px;border-radius:12px;line-height:1.55}.feedback.ok{display:block;background:#edf6ef}.feedback.no{display:block;background:#fff3ef}.modal{position:fixed;inset:0;background:#0005;display:none;place-items:center;padding:20px}.modal.show{display:grid}.modalbox{max-width:520px;background:#fff;border-radius:18px;padding:26px;box-shadow:0 20px 70px #0003}.modalbox h3{font:26px Georgia,serif;color:var(--g);margin-top:0}.score{font:54px Georgia,serif;color:var(--g);margin:15px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}.pic{height:180px}h1{font-size:34px}}

mus","ka":"owl","kb":"vole","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"Europas største ugle. Den jakter hovedsakelig i skumringen og om natten og har svært god hørsel. Hubroen er et rovdyr som fanger små og mellomstore dyr med kraftige klør.","fb":"En liten planteetende gnager som lever på bakken, særlig i områder med mye gress. Den lager ganger og skjul i vegetasjonen og er mest aktiv nær bakken."},{"a":"Kongeørn","b":"Hare","ka":"eagle","kb":"hare","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"En stor rovfugl med svært godt syn, kraftige klør og krokete nebb. Den leter etter byttedyr fra lufta eller fra utkikksposter og kan fange dyr på bakken.","fb":"Et planteetende pattedyr som lever på bakken. Den spiser blant annet gress, urter, kvister og bark. Lange og kraftige bakbein gjør at den kan komme raskt opp i fart."},{"a":"Marihøne","b":"Bladlus","ka":"ladybird","kb":"aphid","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"En liten bille som ofte beveger seg rundt på blader og stengler. Mange arter er rovdyr både som larver og voksne og jakter særlig på små, langsomme insekter.","fb":"Svært små insekter som ofte sitter i grupper på blader og unge skudd. De beveger seg forholdsvis lite og bruker sugende munndeler til å hente næring fra planter."},{"a":"Edderkopp","b":"Flue","ka":"spider","kb":"fly","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"Et rovdyr med åtte bein. Mange arter lager klebrige nett som fanger små dyr som beveger seg gjennom lufta. Andre arter jakter aktivt uten nett.","fb":"Et lite insekt med ett par vinger. Fluer flyr mye mellom ulike steder på jakt etter mat og steder å legge egg."},{"a":"Spekkhogger","b":"Sel","ka":"orca","kb":"seal","sa":"+","sb":"−","rel":"Bytte–rovdyr","fa":"Et stort og kraftig sjøpattedyr i delfinfamilien. Den har tenner, lever i grupper og er et rovdyr. Noen bestander jakter på relativt store dyr nær havoverflaten og langs iskanten.","fb":"Et sjøpattedyr som er godt tilpasset livet i vann. Den må opp til overflaten for å puste og kan hvile på land eller is. Den lever hovedsakelig av fisk og andre marine dyr."},{"a":"Gran","b":"Furu","ka":"spruce","kb":"pine","sa":"−","sb":"−","rel":"Konkurranse","fa":"Et eviggrønt bartre som kan vokse tett og bli høyt. For å vokse trenger det blant annet sollys, vann, mineralnæring og plass til røtter og greiner.","fb":"Et eviggrønt bartre som finnes i mange av de samme skogområdene som gran. Det trenger de samme grunnleggende ressursene, men klarer seg ofte bedre på tørre og næringsfattige voksesteder."},{"a":"Løve","b":"Gepard","ka":"lion","kb":"cheetah","sa":"−","sb":"−","rel":"Konkurranse","fa":"Et stort rovdyr på afrikanske savanner og gressletter. Det jakter hovedsakelig på planteetende hovdyr og kan bevege seg over store områder for å finne mat.","fb":"Et rovdyr som særlig lever i åpne områder i Afrika. Det bruker høy fart til å jakte på planteetende hovdyr og trenger åpne jaktområder med tilgang på byttedyr."},{"a":"Honningbie","b":"Epletre","ka":"bee","kb":"apple","sa":"+","sb":"+","rel":"Mutualisme","fa":"Et sosialt insekt. Arbeiderne flyr mellom blomster og samler nektar og pollen som mat. Pollenkorn fester seg lett til hårene på kroppen og kan bli med videre når bien besøker nye blomster.","fb":"Et løvtre som blomstrer om våren. Blomstene produserer nektar og pollen. For at frø og senere epler skal utvikles, må pollen komme fram til blomstens hunnlige deler."},{"a":"Akasiemaur","b":"Akasie","ka":"ant","kb":"acacia","sa":"+","sb":"+","rel":"Mutualisme","fa":"En maur som lever i kolonier. Arbeiderne forsvarer området der kolonien holder til og kan angripe planteetende insekter og andre dyr som forsøker å spise vegetasjonen der. Maurene trenger både energirik mat og et beskyttet sted for kolonien.","fb":"Enkelte akasiearter har store, hule torner og små strukturer som produserer næringsrik mat som insekter kan spise. Som andre planter kan akasien miste blader og unge skudd når planteetere beiter på den."},{"a":"Pussefisk","b":"Stor revfisk","ka":"cleaner","kb":"reeffish","sa":"+","sb":"+","rel":"Mutualisme","fa":"En liten fisk som lever på korallrev. Den spiser små krepsdyr og annet organisk materiale som den plukker fra overflater. Mange holder til på faste steder som de vender tilbake til.","fb":"En større fisk som lever på korallrev. Små parasitter kan feste seg til hud og gjeller og hente næring der. Enkelte revfisk oppsøker bestemte steder og kan stå uvanlig stille med utspilte finner eller åpen munn."},{"a":"Storfehegre","b":"Storfe","ka":"egret","kb":"cattle","sa":"+","sb":"0","rel":"Kommensalisme","fa":"En liten hegrefugl som finnes i varme og tempererte områder i store deler av verden. Den lever særlig av insekter og andre smådyr på bakken. Den søker ofte etter mat i områder der vegetasjonen er i bevegelse, fordi smådyr da blir lettere å oppdage.","fb":"Store planteetende pattedyr som bruker mye tid på å gå og beite i gressområder. Når de beveger seg gjennom vegetasjonen, bøyer og tråkker de planter og får smådyr i gresset til å bevege seg."},{"a":"Snylteveps","b":"Sommerfugllarve","ka":"wasp","kb":"caterpillar","sa":"+","sb":"−","rel":"Parasittisme","fa":"En stor gruppe små veps. Hos mange arter må larven utvikle seg på eller inne i kroppen til et annet dyr, der den får tilgang til næring mens den vokser. Den voksne hunnen bruker sanseorganer til å finne egnede verter for eggene sine.","fb":"Vekststadiet mellom egg og puppe hos sommerfugler. Larven spiser mye og bygger opp kroppsvev og energilagre. Kroppen inneholder derfor næring som larven trenger for å vokse og senere utvikle seg videre."},{"a":"Bendelorm","b":"Rev","ka":"tapeworm","kb":"fox","sa":"+","sb":"−","rel":"Parasittisme","fa":"En flatorm som ikke har eget fordøyelsessystem. Den må leve inne i et annet dyr og tar opp ferdig fordøyde næringsstoffer direkte gjennom kroppsoverflaten.","fb":"Et mellomstort rovpattedyr som spiser variert kost. Maten brytes ned i fordøyelsessystemet, og næringsstoffer tas normalt opp gjennom tarmveggen og brukes av kroppen."}];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}shuffle(Q);let n=0,score=0,selected="";const $=x=>document.getElementById(x);
function render(){const q=Q[n];selected="";$("signA").value="";$("signB").value="";$("signA").disabled=false;$("signB").disabled=false;document.querySelectorAll(".choice").forEach(b=>b.classList.remove("sel"));$("subs").classList.remove("show");$("feedback").className="feedback";$("feedback").innerHTML="";$("next").style.display="none";$("check").style.display="";$("prog").textContent=`Oppgave ${n+1} av ${Q.length} · ${score} poeng`;$("bar").style.width=`${100*n/Q.length}%`;$("nameA").textContent=q.a;$("nameB").textContent=q.b;$("picA").innerHTML=`<img alt="${q.a}" src="${ASSETS[q.ka]}">`;$("picB").innerHTML=`<img alt="${q.b}" src="${ASSETS[q.kb]}">`;$("nameA").onclick=()=>info(q.a,q.fa);$("nameB").onclick=()=>info(q.b,q.fb)}
document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{if(b.dataset.v==="Symbiose"){document.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");$("subs").classList.add("show");selected=""}else{document.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");selected=b.dataset.v;if(!b.classList.contains("subc"))$("subs").classList.remove("show");else $("subs").classList.add("show")}});
function info(name,text){$("mt").textContent=name;$("mb").textContent=text;$("modal").classList.add("show")}$("close").onclick=()=>$("modal").classList.remove("show");
$("check").onclick=()=>{const q=Q[n],a=$("signA").value,b=$("signB").value;if(!a||!b||!selected){$("feedback").className="feedback no";$("feedback").innerHTML="Velg <b>+, − eller 0 for begge artene</b> og deretter typen samspill.";return}const signs=a===q.sa&&b===q.sb,rel=selected===q.rel,ok=signs&&rel;if(ok)score++;$("feedback").className="feedback "+(ok?"ok":"no");$("feedback").innerHTML=(ok?"<b>Riktig!</b> ":"<b>Ikke helt.</b> ")+(signs?"Virkningen på begge artene er riktig.":`Riktig virkning er <b>${q.a}: ${q.sa}</b> og <b>${q.b}: ${q.sb}</b>.`)+" "+(rel?"Du har også valgt riktig samspill.":`Riktig samspill er <b>${q.rel}</b>.`);$("check").style.display="none";$("next").style.display="inline-block";$("signA").disabled=true;$("signB").disabled=true};
$("next").onclick=()=>{n++;if(n<Q.length)render();else finish()};function finish(){$("bar").style.width="100%";document.querySelector(".grid").innerHTML=`<section class="panel" style="grid-column:1/-1;text-align:center"><h2>Ferdig!</h2><div class="score">${score} / ${Q.length}</div><p>Du har arbeidet med både virkningen på artene og typen samspill.</p><button class="action check" onclick="location.reload()">Start på nytt</button></section>`;$("prog").textContent="Resultat"}render();</script></body></html>
