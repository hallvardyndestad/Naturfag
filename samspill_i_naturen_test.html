:root{--green:#164b3b;--green2:#3f8062;--cream:#ffffff;--line:#dfe5dd;--muted:#718078;--ok:#e7f4ea;--bad:#faebe6}
*{box-sizing:border-box}body{margin:0;background:#f4f4f1;color:#26372f;font-family:Arial,sans-serif}.app{max-width:1120px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 12px 55px #18382d12}

.card{background:white;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 16px 38px #173f320a}.qnum{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#84948b;font-weight:bold}h2{font:700 31px/1.1 Georgia,serif;color:var(--green);margin:9px 0 20px}.choices{display:grid;gap:10px}.choice input,.sub input{position:absolute;opacity:0}label{display:block;padding:14px;border:1px solid #d7ddd8;border-radius:11px;font-weight:bold;cursor:pointer}input:checked+label{background:#edf4ed;border-color:#71927e}.sym{display:none;margin-top:12px;padding:12px;background:#f3f6f1;border-radius:12px}.sym.on{display:block}.subs{display:grid;gap:7px}.sub label{font-size:13px;padding:10px}.feedback{display:none;margin-top:14px;padding:14px;border-radius:11px;font-size:13px;line-height:1.5}.feedback.on{display:block}.feedback.ok{background:var(--ok);color:#315d43}.feedback.bad{background:var(--bad);color:#7a4439}.btn{width:100%;margin-top:16px;border:0;border-radius:11px;background:var(--green2);color:white;padding:14px;font-weight:bold;cursor:pointer}.back{margin-top:12px;border:0;background:none;color:#75847b;cursor:pointer}.result{grid-column:1/-1;text-align:center;padding:90px 10px}.big{font:70px Georgia,serif;color:var(--green)}

const Q=[{"a": "Rødrev", "b": "Fjellrev", "sa": "−", "sb": "−", "main": "Konkurranse", "sub": "", "ia": "fox", "ib": "arcticfox", "fa": "Et mellomstort rovpattedyr i hundefamilien. Arten finnes i store deler av Europa, Asia og Nord-Amerika.", "fb": "En liten rev med tett pels, korte ører og tilpasninger til kalde områder. Den lever i arktiske strøk og høyfjell.", "why": "Begge kan bruke de samme ressursene. Når begge påvirkes negativt av kampen om begrensede ressurser, er samspillet konkurranse (−/−)."}, {"a": "Gran", "b": "Bjørk", "sa": "−", "sb": "−", "main": "Konkurranse", "sub": "", "ia": "spruce", "ib": "birch", "fa": "Et eviggrønt bartre med nåler og hengende kongler. Gran er vanlig i store deler av norsk skog.", "fb": "Et løvtre med lys bark hos mange arter. Bjørk vokser fra lavlandet og høyt opp mot fjellet.", "why": "Trær som vokser nær hverandre kan konkurrere om lys, vann, plass og mineralnæring. Derfor (−/−)."}, {"a": "Løve", "b": "Flekkhyene", "sa": "−", "sb": "−", "main": "Konkurranse", "sub": "", "ia": "lion", "ib": "hyena", "fa": "Et stort kattedyr som lever naturlig hovedsakelig i Afrika. Løver lever ofte i grupper.", "fb": "Et stort rovpattedyr fra Afrika med kraftige kjever og karakteristiske mørke flekker i pelsen.", "why": "De kan bruke mange av de samme byttedyrene og åtslene. Det gir konkurranse (−/−)."}, {"a": "Ulv", "b": "Prærieulv", "sa": "−", "sb": "−", "main": "Konkurranse", "sub": "", "ia": "wolf", "ib": "coyote", "fa": "Det største ville medlemmet av hundefamilien. Ulver lever ofte i familiegrupper og finnes i deler av Europa, Asia og Nord-Amerika.", "fb": "Et nordamerikansk rovpattedyr i hundefamilien. Det er mindre enn ulven og lever i mange ulike naturtyper.", "why": "Artene kan overlappe i leveområde og matvalg. Det kan gi konkurranse (−/−)."}, {"a": "Gaupe", "b": "Rådyr", "sa": "+", "sb": "−", "main": "Bytte–rovdyr", "sub": "", "ia": "lynx", "ib": "deer", "fa": "Et mellomstort kattedyr med kort hale, lange bein og tydelige hårdusker på ørene.", "fb": "Et lite hjortedyr. Hannen har et lite gevir, og arten finnes i store deler av Europa.", "why": "Gaupa kan jakte på rådyr. Rovdyret får næring (+), mens byttet påvirkes negativt (−)."}, {"a": "Ulv", "b": "Elg", "sa": "+", "sb": "−", "main": "Bytte–rovdyr", "sub": "", "ia": "wolf", "ib": "moose", "fa": "Det største ville medlemmet av hundefamilien. Ulver lever ofte i familiegrupper og finnes i deler av Europa, Asia og Nord-Amerika.", "fb": "Det største hjortedyret. Elgen har lange bein og en stor mule, og hannen utvikler gevir.", "why": "Ulv kan jakte på elg. Ulven får mat (+), mens elgen er byttet (−)."}, {"a": "Isbjørn", "b": "Ringsel", "sa": "+", "sb": "−", "main": "Bytte–rovdyr", "sub": "", "ia": "polarbear", "ib": "ringseal", "fa": "Et stort bjørnedyr som lever i Arktis. Den har tykk pels og et isolerende fettlag.", "fb": "En liten selart som lever i arktiske havområder. Den har lyse ringformede mønstre i pelsen.", "why": "Ringsel er et viktig byttedyr for isbjørn: (+/−), altså bytte–rovdyr."}, {"a": "Gepard", "b": "Gaselle", "sa": "+", "sb": "−", "main": "Bytte–rovdyr", "sub": "", "ia": "cheetah", "ib": "gazelle", "fa": "Et slankt kattedyr med lange bein og mørke flekker. Arten lever hovedsakelig i Afrika.", "fb": "En gruppe lette, hurtige hovdyr med slanke bein. De fleste artene lever i Afrika og Asia.", "why": "Geparden jakter på gaseller. Rovdyret får mat (+), byttet taper (−)."}, {"a": "Humle", "b": "Blomsterplante", "sa": "+", "sb": "+", "main": "Symbiose", "sub": "Mutualisme", "ia": "bumblebee", "ib": "flower", "fa": "Et kraftig og hårete insekt i biefamilien. Humler har to par vinger og lever av nektar og pollen.", "fb": "En plante som danner blomster og frø. Blomsterplanter er den største gruppen av landplanter.", "why": "Humla får nektar eller pollen, og planten kan bli pollinert. Begge får fordel (+/+): mutualisme."}, {"a": "Mykorrhizasopp", "b": "Gran", "sa": "+", "sb": "+", "main": "Symbiose", "sub": "Mutualisme", "ia": "mycorrhiza", "ib": "spruce", "fa": "Sopp som lever tett knyttet til planterøtter. Sopptrådene kan danne store nettverk i jorda.", "fb": "Et eviggrønt bartre med nåler og hengende kongler. Gran er vanlig i store deler av norsk skog.", "why": "Soppen får sukker fra planten, mens planten får bedre tilgang til vann og mineralnæring. (+/+): mutualisme."}, {"a": "Maur", "b": "Bladlus", "sa": "+", "sb": "+", "main": "Symbiose", "sub": "Mutualisme", "ia": "ant", "ib": "aphid", "fa": "Sosiale insekter som lever i kolonier. En koloni kan bestå av dronning, arbeidere og hanner.", "fb": "Små insekter med sugende munndeler. Mange arter lever på stengler og blader hos planter.", "why": "Maur kan få honningdugg fra bladlus og beskytte dem. (+/+): mutualisme."}, {"a": "Klovnefisk", "b": "Sjøanemone", "sa": "+", "sb": "+", "main": "Symbiose", "sub": "Mutualisme", "ia": "clownfish", "ib": "anemone", "fa": "Små tropiske fisker med tydelige fargemønstre. De lever på korallrev i Indiahavet og Stillehavet.", "fb": "Et fastsittende nesledyr med en krans av tentakler rundt munnen. Den lever i havet.", "why": "Klovnefisk får beskyttelse, og anemonen kan få fordeler fra fisken. (+/+): mutualisme."}, {"a": "Epifyttisk orkidé", "b": "Tre", "sa": "+", "sb": "0", "main": "Symbiose", "sub": "Kommensalisme", "ia": "orchid", "ib": "tree", "fa": "En orkidé som vokser oppe på andre planter i stedet for med røttene i bakken. Mange finnes i tropiske skoger.", "fb": "En flerårig vedplante med stamme og krone. Trær finnes i svært mange plantefamilier.", "why": "Orkideen får et voksested og lys (+), mens treet i dette skoleeksemplet regnes som omtrent upåvirket (0): kommensalisme."}, {"a": "Remora", "b": "Hai", "sa": "+", "sb": "0", "main": "Symbiose", "sub": "Kommensalisme", "ia": "remora", "ib": "shark", "fa": "En havfisk med en omdannet ryggfinne som danner en sugeskive på toppen av hodet.", "fb": "En bruskfisk med skjelett av brusk i stedet for bein. Det finnes flere hundre haiarter.", "why": "I det klassiske skoleeksemplet får remora transport og tilgang til mat (+), mens haien regnes som omtrent upåvirket (0)."}, {"a": "Rur", "b": "Hval", "sa": "+", "sb": "0", "main": "Symbiose", "sub": "Kommensalisme", "ia": "barnacle", "ib": "whale", "fa": "Et lite krepsdyr som som voksen sitter fast på en hard overflate. Kroppen er beskyttet av kalkplater.", "fb": "Et sjøpattedyr som puster med lunger. Hvaler omfatter både bardehvaler og tannhvaler.", "why": "Ruren får et sted å sitte og transport (+), mens hvalen i det forenklede eksemplet regnes som omtrent upåvirket (0)."}, {"a": "Mose", "b": "Tre", "sa": "+", "sb": "0", "main": "Symbiose", "sub": "Kommensalisme", "ia": "moss", "ib": "tree", "fa": "Små landplanter uten egentlige røtter. De tar opp vann over store deler av overflaten.", "fb": "En flerårig vedplante med stamme og krone. Trær finnes i svært mange plantefamilier.", "why": "Epifyttisk mose kan bruke barken som voksested (+), mens treet i dette skoleeksemplet regnes som omtrent upåvirket (0)."}, {"a": "Flått", "b": "Hjort", "sa": "+", "sb": "−", "main": "Symbiose", "sub": "Parasittisme", "ia": "tick", "ib": "stag", "fa": "Et lite edderkoppdyr med åtte bein som voksen. Flått finnes blant annet i skog, kratt og høyt gress.", "fb": "Et stort hjortedyr. Hannen utvikler gevir, og arten er vanlig langs store deler av norskekysten.", "why": "Flåtten får næring (+), mens verten påvirkes negativt (−): parasittisme."}, {"a": "Lakselus", "b": "Laks", "sa": "+", "sb": "−", "main": "Symbiose", "sub": "Parasittisme", "ia": "louse", "ib": "salmon", "fa": "Et lite krepsdyr som lever i sjøvann. Arten har flere utviklingsstadier gjennom livssyklusen.", "fb": "En strømlinjeformet laksefisk. Atlantisk laks klekkes i ferskvann og tilbringer ofte en del av livet i havet.", "why": "Lakselusa får næring (+), mens laksen kan få skader (−): parasittisme."}, {"a": "Gjøk", "b": "Heipiplerke", "sa": "+", "sb": "−", "main": "Symbiose", "sub": "Parasittisme", "ia": "cuckoo", "ib": "meadowpipit", "f const DIRECT={};
const PAGE={"fox": "Red fox", "arcticfox": "Arctic fox", "spruce": "Picea abies", "birch": "Betula pendula", "lion": "Lion", "hyena": "Spotted hyena", "wolf": "Wolf", "coyote": "Coyote", "lynx": "Eurasian lynx", "deer": "Roe deer", "moose": "Moose", "polarbear": "Polar bear", "ringseal": "Ringed seal", "cheetah": "Cheetah", "gazelle": "Thomson's gazelle", "bumblebee": "Bumblebee", "flower": "Flowering plant", "mycorrhiza": "Mycorrhiza", "ant": "Ant", "aphid": "Aphid", "clownfish": "Clownfish", "anemone": "Sea anemone", "orchid": "Epiphyte", "tree": "Tree", "remora": "Remora", "shark": "Shark", "barnacle": "Barnacle", "whale": "Humpback whale", "moss": "Moss", "tick": "Ixodes ricinus", "stag": "Red deer", "louse": "Salmon louse", "salmon": "Atlantic salmon", "cuckoo": "Common cuckoo", "meadowpipit": "Passerine", "mistletoe": "Viscum album"};
let order=[],idx=0,ans=[],checked=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function restart(){order=shuffle([...Array(Q.length).keys()]);idx=0;ans=Array(Q.length).fill(null);checked=Array(Q.length).fill(false);render()}
function ok(i){let a=ans[i],q=Q[order[i]];return !!a&&a.main===q.main&&(q.main!=="Symbiose"||a.sub===q.sub)}
function total(){return checked.reduce((n,x,i)=>n+(x&&ok(i)?1:0),0)}
function badge(x){return `<span class="badge ${x==="−"?"minus":x==="0"?"zero":""}">${x}</span>`}

async function loadSpeciesImages(){
 document.querySelectorAll(".speciesimg").forEach(el=>{
   const u=GENERATED[el.dataset.key], alt=el.dataset.alt;
   if(!u){el.innerHTML='<div class="species-placeholder">'+alt+'</div>';return;}
   const im=new Image(); im.src=u; im.alt=alt; el.replaceChildren(im);
 });
}
function render(){
 let q=Q[order[idx]],a=ans[idx]||{main:"",sub:""},done=checked[idx];
 meta.textContent=`Oppgave ${idx+1} av ${Q.length}`;pct.textContent=`${Math.round((idx+1)/Q.length*100)} %`;bar.style.width=`${(idx+1)/Q.length*100}%`;score.textContent=`${total()} poeng`;
 main.innerHTML=`<section class="pair"><div class="species"><div class="pic"><div class="speciesimg" data-page="${PAGE[q.ia]}" data-key="${q.ia}" data-alt="${q.a}"><span>Laster bilde…</span></div></div><div><button class="name" data-f="fa">${q.a}</button><div class="tiny">trykk for artsinfo</div><div class="fact" id="fa">${q.fa}</div></div></div>
 <div class="rel"><div class="signs">${badge(q.sa)}<div class="arrow">↕</div>${badge(q.sb)}</div><div class="legend"><b>+</b> fordel<br><b>−</b> ulempe<br><b>0</b> omtrent upåvirket</div></div>
 <div class="species"><div class="pic"><div class="speciesimg" data-page="${PAGE[q.ib]}" data-key="${q.ib}" data-alt="${q.b}"><span>Laster bilde…</span></div></div><div><button class="name" data-f="fb">${q.b}</button><div class="tiny">trykk for artsinfo</div><div class="fact" id="fb">${q.fb}</div></div></div></section>
 <section class="card"><div class="qnum">Oppgave ${idx+1}</div><h2>Hvilket samspill er dette?</h2><div class="choices">${["Konkurranse","Bytte–rovdyr","Symbiose"].map(x=>`<div class="choice"><input type="radio" name="m" id="m${x}" value="${x}" ${a.main===x?"checked":""} ${done?"disabled":""}><label for="m${x}">${x}</label></div>`).join("")}</div>
 <div class="sym ${a.main==="Symbiose"?"on":""}"><div class="subs">${["Mutualisme","Kommensalisme","Parasittisme"].map(x=>`<div class="sub"><input type="radio" name="s" id="s${x}" value="${x}" ${a.sub===x?"checked":""} ${done?"disabled":""}><label for="s${x}">${x}</label></div>`).join("")}</div></div>
 <div id="fbk" class="feedback ${done?"on "+(ok(idx)?"ok":"bad"):""}">${done?`<b>${ok(idx)?"Riktig!":"Ikke helt – prøv å koble tegnene til begrepet."}</b> ${ok(idx)?"":`Riktig svar er <b>${q.main}${q.sub?" – "+q.sub:""}</b>. `}${q.why}`:""}</div>
 <button class="btn" id="go">${done?(idx===Q.length-1?"Se resultat":"Neste oppgave →"):"Sjekk svar"}</button><button class="back" id="back" ${idx===0?"disabled":""}>← Forrige oppgave</button></section>`;
 loadSpeciesImages();
 document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.f).classList.toggle("on"));
 document.querySelectorAll('input[name=m]').forEach(e=>e.onchange=()=>{ans[idx]=ans[idx]||{main:"",sub:""};ans[idx].main=e.value;if(e.value!=="Symbiose")ans[idx].sub="";render()});
 document.querySelectorAll('input[name=s]').forEach(e=>e.onchange=()=>{ans[idx]=ans[idx]||{main:"Symbiose",sub:""};ans[idx].main="Symbiose";ans[idx].sub=e.value;render()});
 back.onclick=()=>{if(idx){idx--;render()}};
 go.onclick=()=>{if(!checked[idx]){let z=ans[idx];if(!z||!z.main||(z.main==="Symbiose"&&!z.sub)){fbk.className="feedback on bad";fbk.innerHTML="<b>Velg et svar først.</b> Ved symbiose må du også velge undertype.";return}checked[idx]=true;render();return}if(idx<Q.length-1){idx++;render()}else result()};
}
function result(){let n=total();main.innerHTML=`<div class="result"><h2>Testen er ferdig</h2><div class="big">${n} / ${Q.length}</div><p>${n>=16?"God kontroll på samspill i naturen.":"Ta gjerne en ny runde og bruk tegnene aktivt."}</p><button class="btn" style="max-width:260px" onclick="restart()">Ta testen på nytt</button></div>`}
restart();
</script></body></html><style>
